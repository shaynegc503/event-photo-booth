<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Event Photo Booth</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
.app{width:min(100%,720px);min-height:100vh;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{font-size:21px;margin:0;text-align:center}
.stage{position:relative;width:100%;aspect-ratio:9/16;background:#000;overflow:hidden;border-radius:18px}
video,.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
.overlay{pointer-events:none}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:13px 19px;font-size:16px;font-weight:700;background:#fff;color:#111}
button.secondary{background:#333;color:#fff}
button:disabled{opacity:.45}
#result{display:none}
#photo{width:100%;border-radius:18px;display:block}
.hint{text-align:center;color:#aaa;font-size:13px;line-height:1.4;margin:0}
canvas{display:none}
.note{background:#222;border-radius:14px;padding:10px 13px;font-size:13px;color:#ccc;line-height:1.45}
</style>
</head>
<body>
<div class="app">
<h1>Event Photo Booth</h1>

<div class="stage" id="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="overlay" class="overlay" src="frame.png" alt="">
  <canvas id="canvas"></canvas>
</div>

<div class="controls">
  <button id="start">Start camera</button>
  <button id="capture" disabled>Take photo</button>
  <button id="switch" class="secondary" disabled>Switch camera</button>
</div>

<div id="result">
  <img id="photo" alt="Your finished event photo">
  <div class="controls" style="margin-top:12px">
    <button id="download">Save photo</button>
    <button id="retake" class="secondary">Retake</button>
  </div>
  <div class="note">
    iPhone：點「Save photo」後會嘗試直接儲存到「照片」。如果瀏覽器不允許直接寫入照片圖庫，會改用分享選單；請選「儲存影像」。
  </div>
</div>

<p class="hint">No app installation. The photo is processed on this device.</p>
</div>

<script>
const video=document.getElementById('video');
const overlay=document.getElementById('overlay');
const canvas=document.getElementById('canvas');
const startBtn=document.getElementById('start');
const captureBtn=document.getElementById('capture');
const switchBtn=document.getElementById('switch');
const result=document.getElementById('result');
const photo=document.getElementById('photo');
const downloadBtn=document.getElementById('download');
const retakeBtn=document.getElementById('retake');
const stage=document.getElementById('stage');

let stream=null;
let facingMode='user';
let lastBlob=null;
let lastDataUrl=null;

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    video.style.transform=facingMode==='user'?'scaleX(-1)':'none';

    captureBtn.disabled=false;
    switchBtn.disabled=false;
    startBtn.textContent='Camera on';
  }catch(e){
    alert('Camera access failed. Please allow camera permission and open this page over HTTPS.');
  }
}

function getCrop(vw,vh,W,H){
  /*
    Keep the output aspect ratio identical to the on-screen 9:16 frame.
    No digital zoom is applied.
  */
  const target=W/H;
  const ratio=vw/vh;
  let sw,sh;

  if(ratio>target){
    sh=vh;
    sw=vh*target;
  }else{
    sw=vw;
    sh=vw/target;
  }

  return {
    sx:(vw-sw)/2,
    sy:(vh-sh)/2,
    sw,sh
  };
}

function capture(){
  if(!video.videoWidth || !video.videoHeight) return;

  const W=1080;
  const H=1920;
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext('2d');
  const c=getCrop(video.videoWidth,video.videoHeight,W,H);

  ctx.save();

  if(facingMode==='user'){
    ctx.translate(W,0);
    ctx.scale(-1,1);
  }

  ctx.drawImage(
    video,
    c.sx,c.sy,c.sw,c.sh,
    0,0,W,H
  );

  ctx.restore();

  // Activity frame remains fixed and is composited on top.
  ctx.drawImage(overlay,0,0,W,H);

  canvas.toBlob(blob=>{
    if(!blob)return;
    lastBlob=blob;
    lastDataUrl=URL.createObjectURL(blob);
    photo.src=lastDataUrl;
    result.style.display='block';
    stage.style.display='none';
    captureBtn.disabled=true;
  },'image/jpeg',0.92);
}

async function savePhoto(){
  if(!lastBlob)return;

  /*
    iPhone/iOS Safari does not provide a normal web API that can silently
    write an image straight into Photos. Web Share is the closest native
    workflow: the user gets the iOS share sheet and can choose "Save Image".
  */
  if(navigator.share && navigator.canShare){
    const file=new File([lastBlob],'event-photo.jpg',{type:'image/jpeg'});
    try{
      if(navigator.canShare({files:[file]})){
        await navigator.share({
          files:[file],
          title:'Event Photo'
        });
        return;
      }
    }catch(e){
      if(e.name==='AbortError') return;
    }
  }

  // Fallback for browsers without file sharing.
  const a=document.createElement('a');
  a.href=lastDataUrl;
  a.download='event-photo.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function retake(){
  result.style.display='none';
  stage.style.display='block';
  captureBtn.disabled=!stream;
}

startBtn.addEventListener('click',startCamera);
switchBtn.addEventListener('click',async()=>{
  facingMode=facingMode==='user'?'environment':'user';
  await startCamera();
});
captureBtn.addEventListener('click',capture);
retakeBtn.addEventListener('click',retake);
downloadBtn.addEventListener('click',savePhoto);
</script>
</body>
</html>
